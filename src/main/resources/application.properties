spring.application.name=order_management_system

# --- Database ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_management_system}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Schema management ---
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# --- Pagination defaults for GET /api/orders ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot=INFO

# Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG

# Hibernate SQL parameter values
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Hibernate
logging.level.org.hibernate=INFO

# Database connection pool
logging.level.com.zaxxer.hikari=DEBUG

# Your application
logging.level.com.leila=DEBUG

# Detailed error information
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always